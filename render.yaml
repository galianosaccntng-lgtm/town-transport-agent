services:
  - type: web
    name: town-transport-agent
    runtime: docker
    plan: free
    envVars:
      - key: VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: GRAPH_VERSION
        value: v21.0
